name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - "PJ/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "15.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-build-test:
    name: Quality, Build, and Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Check shell scripts
        run: bash -n script/build_and_run.sh

      - name: Swift format lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --recursive Sources Tests
          else
            echo "swift-format is not installed on this runner; skipping lint."
          fi

      - name: Xcode unit tests
        run: |
          xcodebuild \
            -project LoomClone.xcodeproj \
            -scheme LoomClone \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath /tmp/loomclone-test-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Xcode Debug build
        run: |
          xcodebuild \
            -project LoomClone.xcodeproj \
            -scheme LoomClone \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath /tmp/loomclone-debug-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Xcode Release build
        run: |
          xcodebuild \
            -project LoomClone.xcodeproj \
            -scheme LoomClone \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath /tmp/loomclone-release-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Xcode analyze
        run: |
          xcodebuild \
            -project LoomClone.xcodeproj \
            -scheme LoomClone \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath /tmp/loomclone-analyze-derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Package app bundle
        run: ./script/build_and_run.sh --package

      - name: Verify packaged app
        run: |
          test "$(lipo -archs dist/LoomClone.app/Contents/MacOS/LoomClone)" = "arm64"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - dist/LoomClone.app/Contents/Info.plist)" = "15.0"

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: macos-15"
            echo "- Target: macOS 15.0, arm64"
            echo "- App bundle: dist/LoomClone.app"
            echo ""
            echo "### Checks"
            echo ""
            echo "- Shell script syntax"
            echo "- Swift format lint when swift-format is installed"
            echo "- Xcode unit tests for macOS arm64"
            echo "- Xcode Debug build for macOS arm64"
            echo "- Xcode Release build for macOS arm64"
            echo "- Xcode analyze for macOS arm64"
            echo "- App bundle packaging and metadata verification"
          } >> "$GITHUB_STEP_SUMMARY"
