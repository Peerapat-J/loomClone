name: Release Preview

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  package:
    name: Package Unsigned App
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Unit tests
        run: swift test --arch arm64

      - name: Package app bundle
        run: ./script/build_and_run.sh --package

      - name: Verify packaged app
        run: |
          test "$(lipo -archs dist/LoomClone.app/Contents/MacOS/LoomClone)" = "arm64"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - dist/LoomClone.app/Contents/Info.plist)" = "15.0"

      - name: Create zip artifact
        run: ditto -c -k --keepParent dist/LoomClone.app dist/LoomClone-macos15-arm64.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: LoomClone-macos15-arm64
          path: dist/LoomClone-macos15-arm64.zip
          retention-days: 14
